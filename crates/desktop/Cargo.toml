[package]
name = "deskboxes"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false
description = "Deskboxes core: the desktop surface, items, boxes, input, drag and drop, menus via the shell host."

[[bin]]
name = "deskboxes"
path = "src/main.rs"

[dependencies]
deskboxes-core = { workspace = true }
deskboxes-shell = { workspace = true }
deskboxes-render = { workspace = true }
deskboxes-ipc = { workspace = true }
deskboxes-i18n = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
windows-core = { workspace = true }
windows-numerics = "0.3"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_UI_Accessibility",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Globalization",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
