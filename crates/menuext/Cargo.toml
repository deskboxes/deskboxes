[package]
name = "deskboxes-menuext"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false
description = "\"Turn on Deskboxes\" in Windows 11's desktop context menu while Deskboxes is turned off (an IExplorerCommand in a sparse package)."

[lib]
name = "deskboxes_menu"
crate-type = ["cdylib"]

[dependencies]
deskboxes-i18n = { workspace = true }
deskboxes-shell = { workspace = true }
serde_json = { workspace = true }
windows-core = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
