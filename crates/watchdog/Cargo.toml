[package]
name = "deskboxes-watchdog"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false
description = "Starts the Deskboxes core, restarts it after a crash or hang, restores native icons when it cannot."

[[bin]]
name = "deskboxes-watchdog"
path = "src/main.rs"

[dependencies]
deskboxes-shell = { workspace = true }
log = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
