<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;overflow:hidden;transform-origin:0 0}
.wp{position:absolute;inset:0;background-repeat:no-repeat}
.abs{position:absolute}
.ui{font-family:'Segoe UI Variable Text','Segoe UI',sans-serif}
.gl{font-family:'Segoe Fluent Icons','Segoe MDL2 Assets';font-style:normal;line-height:1}
.box{position:absolute;border-radius:var(--r,14px);overflow:hidden;box-shadow:0 28px 70px rgba(0,0,0,var(--sh)),0 3px 10px rgba(0,0,0,.18)}
.box>.bg{position:absolute;inset:0;backdrop-filter:blur(38px) saturate(1.45);-webkit-backdrop-filter:blur(38px) saturate(1.45)}
.box>.bd{position:absolute;inset:0;border-radius:var(--r,14px);pointer-events:none}
.box>.hd{position:absolute;left:0;right:0;top:0;height:58px}
.ttl{position:absolute;left:0;right:0;top:0;height:58px;display:flex;align-items:center;justify-content:center;font:600 22px 'Segoe UI Variable Display','Segoe UI';letter-spacing:.1px}
.tabs{position:absolute;left:10px;top:9px;display:flex;gap:6px}
.tab{height:40px;padding:0 18px;border-radius:9px;display:flex;align-items:center;font:600 20px 'Segoe UI Variable Display','Segoe UI';white-space:nowrap}
.hbtn{position:absolute;top:9px;width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:19px}
.grid{position:absolute;left:14px;top:68px;display:grid;grid-auto-rows:134px}
.it{display:flex;flex-direction:column;align-items:center;padding-top:8px;border-radius:8px;position:relative}
.it svg{width:76px;height:76px;flex:none}
.it span{font:400 17.5px 'Segoe UI Variable Text','Segoe UI';text-align:center;line-height:1.22;margin-top:5px;max-width:116px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.desk span{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.85),0 0 6px rgba(0,0,0,.4)}
.desk svg{filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.card{position:absolute;border-radius:12px;backdrop-filter:blur(40px) saturate(1.3);box-shadow:0 24px 60px rgba(0,0,0,.35)}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:64px;padding:0 20px;border-radius:12px;font:600 26px 'Segoe UI Variable Display','Segoe UI';box-sizing:border-box}
.plus{font:600 30px 'Segoe UI';margin:0 14px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5)}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
 <linearGradient id="gfold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD965"/><stop offset="1" stop-color="#F5B132"/></linearGradient>
 <linearGradient id="gback" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9A825"/><stop offset="1" stop-color="#D38F12"/></linearGradient>
 <linearGradient id="gpage" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF0F3"/></linearGradient>
 <linearGradient id="gsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3D8BFF"/><stop offset="1" stop-color="#B9DCFF"/></linearGradient>
 <linearGradient id="gsky2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#FFD39A"/></linearGradient>
</defs></svg>
<div id="stage"><div class="wp" id="wp"></div></div>
<script>
const P = new URLSearchParams(location.hash.slice(1));
const SCENE = P.get('scene') || 'tabs', THEME = P.get('theme') || 'dark', THUMB = P.get('thumb') === '1';
const D = THEME === 'dark';
const ACC = D ? '#4CC2FF' : '#0067C0';
const ACCF = D ? 'rgba(76,194,255,' : 'rgba(0,103,192,';
const FG = D ? '#FFFFFF' : '#1B1B1B';

// ---------- icons (my own drawings, 64x64) ----------
const page = (badge) => `<svg viewBox="0 0 64 64"><path d="M15 3h24l14 14v42a3 3 0 0 1-3 3H15a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z" fill="url(#gpage)" stroke="rgba(0,0,0,.14)" stroke-width="1"/><path d="M39 3v11a3 3 0 0 0 3 3h11z" fill="#D9DDE3"/>
<g stroke="#C9CED6" stroke-width="2.4" stroke-linecap="round"><path d="M34 30h12M34 37h12M34 44h12M20 51h26"/></g>${badge}</svg>`;
const badge = (c, inner) => `<rect x="5" y="26" width="27" height="25" rx="4" fill="${c}"/>${inner}`;
const linesG = '<g stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M11 33h15M11 38.5h15M11 44h10"/></g>';
const ICONS = {
  folder: `<svg viewBox="0 0 64 64"><path d="M5 15a4 4 0 0 1 4-4h15.5a4 4 0 0 1 2.9 1.2l4.3 4.3H55a4 4 0 0 1 4 4V26H5z" fill="url(#gback)"/><path d="M5 23.5a3 3 0 0 1 3-3h48a3 3 0 0 1 3 3V51a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z" fill="url(#gfold)"/><path d="M5 25h54" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/></svg>`,
  folderdoc: `<svg viewBox="0 0 64 64"><path d="M5 15a4 4 0 0 1 4-4h15.5a4 4 0 0 1 2.9 1.2l4.3 4.3H55a4 4 0 0 1 4 4V26H5z" fill="url(#gback)"/><rect x="14" y="14" width="34" height="26" rx="2" fill="#fff"/><path d="M19 21h22M19 26h22M19 31h14" stroke="#9AA3AE" stroke-width="2" stroke-linecap="round"/><path d="M5 23.5a3 3 0 0 1 3-3h48a3 3 0 0 1 3 3V51a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z" fill="url(#gfold)" opacity=".96"/></svg>`,
  doc: page(badge('#2F6FDE', linesG)),
  sheet: page(badge('#1E8E4E', '<g stroke="#fff" stroke-width="2"><rect x="10" y="31" width="17" height="15" fill="none" rx="1"/><path d="M10 38.5h17M18.5 31v15"/></g>')),
  slides: page(badge('#E0612B', '<g fill="#fff"><rect x="10" y="40" width="3.5" height="6"/><rect x="16" y="35" width="3.5" height="11"/><rect x="22" y="31" width="3.5" height="15"/></g>')),
  pdf: page(badge('#D93636', '<text x="18.5" y="43.5" text-anchor="middle" font-family="Segoe UI" font-weight="700" font-size="10.5" fill="#fff">PDF</text>')),
  txt: `<svg viewBox="0 0 64 64"><path d="M15 3h24l14 14v42a3 3 0 0 1-3 3H15a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z" fill="url(#gpage)" stroke="rgba(0,0,0,.14)"/><path d="M39 3v11a3 3 0 0 0 3 3h11z" fill="#D9DDE3"/><g stroke="#8E96A1" stroke-width="2.4" stroke-linecap="round"><path d="M20 26h24M20 33h24M20 40h24M20 47h16"/></g></svg>`,
  md: page(badge('#7B4FD6', '<path d="M10 45V33l4.5 5 4.5-5v12M23 33v12m-3.5-3.5L23 45l3.5-3.5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>')),
  music: page(badge('#B0399A', '<path d="M15 44a3 3 0 1 1-2-2.8V32l11-2.5v11.6a3 3 0 1 1-2-2.8V32.6l-7 1.6z" fill="#fff"/>')),
  video: page(badge('#6A3DD8', '<path d="M14 32.5v12l10-6z" fill="#fff"/>')),
  zip: `<svg viewBox="0 0 64 64"><path d="M15 3h24l14 14v42a3 3 0 0 1-3 3H15a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z" fill="#F4C24A" stroke="rgba(0,0,0,.14)"/><path d="M39 3v11a3 3 0 0 0 3 3h11z" fill="#D9A52C"/><g fill="#7A5A10"><rect x="27" y="6" width="5" height="4"/><rect x="32" y="10" width="5" height="4"/><rect x="27" y="14" width="5" height="4"/><rect x="32" y="18" width="5" height="4"/><rect x="27" y="22" width="5" height="4"/><rect x="27" y="30" width="10" height="12" rx="2"/></g><rect x="29.5" y="35" width="5" height="4" fill="#F4C24A"/></svg>`,
  img: `<svg viewBox="0 0 64 64"><rect x="5" y="9" width="54" height="46" rx="5" fill="#fff"/><rect x="8" y="12" width="48" height="40" rx="3" fill="url(#gsky)"/><circle cx="44" cy="22" r="5" fill="#FFE27A"/><path d="M8 44l13-14 10 10 7-6 18 15v0a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3z" fill="#1F9E6E"/><path d="M8 47l11-9 12 9 9-6 16 9v1a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3z" fill="#15805A"/></svg>`,
  img2: `<svg viewBox="0 0 64 64"><rect x="5" y="9" width="54" height="46" rx="5" fill="#fff"/><rect x="8" y="12" width="48" height="40" rx="3" fill="url(#gsky2)"/><circle cx="32" cy="34" r="9" fill="#FFF1C2"/><path d="M8 38h48v11a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3z" fill="#2F7FD0"/><path d="M8 41c8 2 16-2 24 0s16 2 24 0" stroke="#9CD2FF" stroke-width="1.6" fill="none"/></svg>`,
};
const APPS = {
  calc: ['#3A3A3A', '#1F1F1F', ''], term: ['#2B2B2B', '#0C0C0C', ''], note: ['#4DA3FF', '#1C6FD6', ''],
  photo: ['#3FC0F5', '#1676D9', ''], mail: ['#2E8BEA', '#1255B5', ''], web: ['#29B2A0', '#0C7A8A', ''],
  music: ['#F25EA0', '#C2287A', ''], set: ['#8A8F99', '#5B606A', ''], cal: ['#4F7DF0', '#2A50C4', ''],
  game: ['#7FCB3F', '#3E8E1E', ''], chat: ['#7B6CF0', '#4C3DC4', ''], map: ['#F2A33A', '#D06A12', ''],
};
function appIcon(k) {
  const [a, b, g] = APPS[k];
  return `<svg viewBox="0 0 64 64"><defs><linearGradient id="ga_${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect x="6" y="6" width="52" height="52" rx="13" fill="url(#ga_${k})"/><rect x="6.5" y="6.5" width="51" height="51" rx="12.5" fill="none" stroke="rgba(255,255,255,.22)"/><text x="32" y="43.5" text-anchor="middle" font-family="Segoe Fluent Icons" font-size="27" fill="#fff">${g}</text></svg>`;
}
const iconSvg = k => k.startsWith('app:') ? appIcon(k.slice(4)) : ICONS[k];

// ---------- building blocks ----------
const COLS = { teal: [14, 110, 122], purple: [107, 63, 160], green: [27, 122, 62], amber: [176, 112, 20], rose: [170, 52, 92], blue: [28, 84, 170], slate: [60, 72, 90] };
function boxBg(tint, op) {
  if (tint) { const [r, g, b] = COLS[tint]; return D ? `rgba(${r},${g},${b},${op ?? .5})` : `linear-gradient(rgba(${r},${g},${b},${(op ?? .5) * .62}),rgba(${r},${g},${b},${(op ?? .5) * .62})),rgba(255,255,255,.5)`; }
  return D ? `rgba(28,28,30,${op ?? .56})` : `rgba(246,246,248,${op ?? .66})`;
}
function item(k, label, o = {}) {
  const sel = o.sel ? `background:${ACCF}.30);box-shadow:inset 0 0 0 1.5px ${ACCF}.85);` : o.hover ? `background:${D ? 'rgba(255,255,255,.10)' : 'rgba(0,0,0,.06)'};` : '';
  const dim = o.dim ? 'opacity:.22;' : '';
  const lab = o.priv ? `<i style="display:block;height:9px;width:${50 + (label.length * 5) % 40}px;border-radius:5px;margin-top:14px;background:${D ? 'rgba(255,255,255,.55)' : 'rgba(0,0,0,.35)'}"></i>` : `<span>${label}</span>`;
  const ic = o.priv ? `<div style="width:66px;height:66px;margin:5px;border-radius:12px;border:2.5px dashed ${D ? 'rgba(255,255,255,.55)' : 'rgba(0,0,0,.35)'};box-sizing:border-box"></div>` : `<div style="${o.icf ? 'filter:' + o.icf : ''}">${iconSvg(k)}</div>`;
  return `<div class="it" style="${sel}${dim}">${ic}${lab}${o.badge || ''}</div>`;
}
// A box. o: x,y,cols,rows,title|tabs,active,tint,op,items,hover(header buttons),lock,rolled,w,h,titleStyle,left,folderGlyph,back,outline,extra
function box(o) {
  const cols = o.cols || 4, rows = o.rows || 1;
  const w = o.w || 28 + cols * 124, h = o.rolled ? 58 : (o.h || 68 + rows * 134 + 10);
  const light = !D && !o.forceDark;
  const fg = o.fg || (light ? '#1B1B1B' : '#FFFFFF');
  const band = o.band ?? (light ? 'rgba(0,0,0,.045)' : 'rgba(0,0,0,.22)');
  const line = o.outline || (light ? 'rgba(0,0,0,.10)' : 'rgba(255,255,255,.14)');
  const ow = o.outlineW || 1.5;
  let head = '';
  const right = [];
  if (o.hover) right.push('', '');
  if (o.lock) right.push('');
  if (o.btns) right.push(...o.btns);
  if (o.tabs) {
    head = `<div class="tabs">` + o.tabs.map((t, i) => {
      const [name, col] = Array.isArray(t) ? t : [t, null];
      const act = i === (o.active || 0);
      let bg = 'transparent', c = fg, op = act ? 1 : .68;
      if (col) { const [r, g, b] = COLS[col]; bg = act ? `rgba(${r},${g},${b},.9)` : `rgba(${r},${g},${b},${o.tabHover === i ? .62 : .42})`; c = '#fff'; op = act ? 1 : .9; }
      else if (act) bg = light ? 'rgba(0,0,0,.08)' : 'rgba(0,0,0,.34)';
      else if (o.tabHover === i) bg = light ? 'rgba(0,0,0,.05)' : 'rgba(255,255,255,.08)';
      return `<div class="tab" style="background:${bg};color:${c};opacity:${op}">${name}</div>`;
    }).join('') + `</div>`;
  } else {
    const al = o.left ? `justify-content:flex-start;padding-left:${o.folderGlyph || o.back ? 58 : 20}px;` : '';
    const tf = o.titleFont ? `font-family:${o.titleFont};` : '';
    const tw = o.titleWeight ? `font-weight:${o.titleWeight};` : '';
    head = `<div class="ttl" style="color:${fg};${al}${tf}${tw}">${o.title}</div>`;
    if (o.folderGlyph || o.back) head += `<div class="hbtn gl" style="left:9px;color:${fg};${o.back ? `background:${light ? 'rgba(0,0,0,.06)' : 'rgba(255,255,255,.10)'};opacity:1` : 'opacity:.62'}">${o.back ? '' : ''}</div>`;
  }
  head += right.reverse().map((g, i) => `<div class="hbtn gl" style="right:${8 + i * 44}px;color:${fg};opacity:${g === '' ? .7 : .78};${o.btnHover === g ? `background:${light ? 'rgba(0,0,0,.06)' : 'rgba(255,255,255,.12)'};opacity:1` : ''}">${g}</div>`).join('');
  const items = o.rolled ? '' : `<div class="grid ${light ? '' : 'desk'}" style="grid-template-columns:repeat(${cols},124px);${o.gridTop ? 'top:' + o.gridTop + 'px;' : ''}${light ? `color:${fg}` : ''}">${(o.items || []).map(a => item(a[0], a[1], a[2] || {})).join('')}</div>`;
  return `<div class="box ui" style="left:${o.x}px;top:${o.y}px;width:${w}px;height:${h}px;--sh:${o.shadow ?? (D ? .42 : .22)};${o.r !== undefined ? '--r:' + o.r + 'px;' : ''}${o.style || ''}">
   <div class="bg" style="background:${boxBg(o.tint, o.op)}"></div>
   ${o.rolled ? '' : `<div class="hd" style="background:${band}"></div>`}
   ${head}${items}${o.extra || ''}
   <div class="bd" style="box-shadow:inset 0 0 0 ${ow}px ${line}"></div></div>`;
}
function cursor(x, y, s = 1.7) {
  return `<svg class="abs" style="left:${x}px;top:${y}px;width:${22 * s}px;height:${32 * s}px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45));z-index:50" viewBox="0 0 22 32"><path d="M1.5 1.5v24.2l6.2-6 4.3 9.6 4-1.8-4.2-9.4h8.6z" fill="#fff" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}
function ripple(x, y) {
  return `<div class="abs" style="left:${x - 34}px;top:${y - 34}px;width:68px;height:68px;border-radius:50%;border:3px solid rgba(255,255,255,.9);box-shadow:0 0 18px rgba(255,255,255,.5);z-index:49"></div>
  <div class="abs" style="left:${x - 54}px;top:${y - 54}px;width:108px;height:108px;border-radius:50%;border:2px solid rgba(255,255,255,.45);z-index:49"></div>`;
}
function key(t, wide) {
  const k = D ? 'background:linear-gradient(#3A3A3E,#2A2A2E);color:#fff;box-shadow:0 5px 0 #18181A,0 10px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.15)' : 'background:linear-gradient(#FFFFFF,#ECECEF);color:#1B1B1B;box-shadow:0 5px 0 #BDBDC4,0 10px 24px rgba(0,0,0,.25),inset 0 1px 0 #fff';
  return `<div class="key" style="${k};${wide ? 'min-width:' + wide + 'px' : ''}">${t}</div>`;
}
function card(x, y, w, h, inner, extra = '') {
  return `<div class="card ui" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${D ? 'rgba(40,40,44,.78)' : 'rgba(252,252,253,.82)'};box-shadow:0 24px 60px rgba(0,0,0,${D ? .45 : .2}),inset 0 0 0 1px ${D ? 'rgba(255,255,255,.10)' : 'rgba(0,0,0,.07)'};color:${FG};${extra}">${inner}</div>`;
}
function badgeCircle(x, y, glyph, size = 96) {
  return `<div class="abs gl" style="left:${x}px;top:${y}px;width:${size}px;height:${size}px;border-radius:50%;background:${ACC};color:${D ? '#00243A' : '#fff'};display:flex;align-items:center;justify-content:center;font-size:${size * .45}px;box-shadow:0 14px 36px rgba(0,0,0,.4),0 0 0 6px ${D ? 'rgba(76,194,255,.22)' : 'rgba(0,103,192,.18)'};z-index:40">${glyph}</div>`;
}
function arrow(x1, y1, x2, y2, bend = -120, dashed = true) {
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 + bend;
  const ang = Math.atan2(y2 - my, x2 - mx);
  const a1 = ang + 2.6, a2 = ang - 2.6, L = 22;
  return `<svg class="abs nofit" style="left:0;top:0;width:100%;height:100%;z-index:45;overflow:visible;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))"><path d="M${x1} ${y1}Q${mx} ${my} ${x2} ${y2}" fill="none" stroke="${ACC}" stroke-width="5" stroke-linecap="round" ${dashed ? 'stroke-dasharray="14 12"' : ''}/><path d="M${x2 + L * Math.cos(a1)} ${y2 + L * Math.sin(a1)}L${x2} ${y2}L${x2 + L * Math.cos(a2)} ${y2 + L * Math.sin(a2)}" fill="none" stroke="${ACC}" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

// ---------- item sets ----------
const DOCS = [['doc', 'Report.docx'], ['doc', 'Cover letter.docx'], ['slides', 'Pitch.pptx'], ['pdf', 'Manual.pdf'], ['txt', 'Notes.txt'], ['pdf', 'Contract.pdf'], ['md', 'Plan.md'], ['doc', 'Resume.docx']];
const SHEETS = [['sheet', 'Budget.xlsx'], ['sheet', 'Sales Q3.xlsx'], ['sheet', 'Data.csv']];
const APPL = [['app:calc', 'Calculator'], ['app:term', 'Terminal'], ['app:note', 'Notepad'], ['app:photo', 'Photos'], ['app:mail', 'Mail'], ['app:web', 'Browser'], ['app:music', 'Music'], ['app:set', 'Settings']];
const MEDIA = [['img', 'Holiday.png'], ['img2', 'Beach.jpg'], ['music', 'Song.mp3'], ['video', 'Clip.mp4'], ['music', 'Podcast.mp3'], ['img', 'Hiking.png']];
const FOLD = ['Archive', 'Invoices', 'Music', 'Photos', 'Projects', 'Recipes', 'School', 'Travel'].map(n => ['folder', n]);

// ---------- scenes (1600x900 unless set) ----------
// wp: [size, x, y] of the wallpaper; focus: [x, y, zoom] for the Home tile close-up.
const S = {};
S.home = () => ({ w: 1920, h: 534, wp: [2300, -360, -560], html:
  box({ x: 990, y: 52, cols: 3, rows: 2, tabs: [['Documents'], ['Sheets', 'green']], items: DOCS }) +
  box({ x: 1416, y: 52, cols: 2, rows: 2, title: 'Apps', tint: 'teal', items: APPL.slice(0, 4) }) +
  box({ x: 990, y: 424, w: 400, title: 'Archives', rolled: true }) +
  box({ x: 1416, y: 424, w: 276, title: 'Media', rolled: true, tint: 'purple' }) });
S.tabs = () => ({ wp: [2300, -420, -360], focus: [140, 110, 1.55], html:
  box({ x: 150, y: 120, cols: 5, rows: 2, tabs: [['Documents'], ['Spreadsheets', 'green'], ['Slides', 'amber']], tabHover: 1, hover: true, items: DOCS.slice(0, 7).concat([['slides', 'Pitch v2.pptx'], ['doc', 'Letter.docx'], ['txt', 'Ideas.txt']]) }) +
  box({ x: 880, y: 300, cols: 4, rows: 2, tabs: [['Photos', 'purple'], ['Music'], ['Videos']], items: MEDIA.concat([['img2', 'Sunset.jpg'], ['img', 'Lake.png']]) }) +
  cursor(470, 162) });
S.rollup = () => ({ wp: [2300, -300, -420], focus: [700, 120, 1.5], html:
  box({ x: 140, y: 160, cols: 4, rows: 2, title: 'Apps', tint: 'teal', items: APPL }) +
  box({ x: 760, y: 160, w: 600, title: 'Archives', rolled: true, btns: [''], btnHover: '' }) +
  box({ x: 760, y: 244, w: 600, title: 'Games', rolled: true, tint: 'purple' }) +
  box({ x: 760, y: 328, w: 600, cols: 4, rows: 1, title: 'Media', btns: [''], items: MEDIA.slice(0, 4) }) +
  cursor(1290, 196) });

// Frame the scene: its contents (or, for a Home tile, the part that shows the feature) fill the picture.
let rect = null, fill = .88;
if (THUMB && FOCUS[SCENE]) { rect = FOCUS[SCENE]; fill = 1; }
// Page pictures are small too: these show the close-up with a little more around it.
else if (['tabs', 'rollup', 'az', 'locks'].includes(SCENE)) { rect = FOCUS[SCENE]; fill = .9; }
else if (!NOFIT.includes(SCENE)) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const el of content.children) {
    if (el.classList.contains('nofit')) continue;
    const r = el.getBoundingClientRect();
    if (!r.width) continue;
    x0 = Math.min(x0, r.left); y0 = Math.min(y0, r.top); x1 = Math.max(x1, r.right); y1 = Math.max(y1, r.bottom);
  }
  rect = [x0, y0, x1 - x0, y1 - y0];
  if (THUMB) fill = .97;
}

  const [x, y, w, h] = rect;
  const k = Math.min(fill * W / w, fill * H / h, 1.9);
  const tx = W / 2 - (x + w / 2) * k, ty = H / 2 - (y + h / 2) * k;
  content.style.transform = `translate(${tx}px,${ty}px) scale(${k})`;

  const z = 1 + (k - 1) * .35;
  wpEl.style.backgroundSize = ws * z + 'px auto';
  wpEl.style.backgroundPosition = `${wx * z + (1 - z) * W / 2}px ${wy * z + (1 - z) * H / 2}px`;
}
