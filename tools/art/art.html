<!doctype html>
<html><head><meta charset="utf-8">
<!-- The Settings pictures: each feature as a short scene on the WIP wallpaper, with the real
     icons of popular apps (icons.ps1) and boxes drawn as Deskboxes draws them. A scene is a function
     of time: frame(0) is the still picture, frame(0..dur) the clip that plays while the pointer is on
     it (render.mjs records both). #scene=NAME&theme=dark|light&t=SECONDS shows one frame. -->
<style>
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;overflow:hidden}
.wp{position:absolute;inset:0;background-repeat:no-repeat}
.abs{position:absolute}
.ui{font-family:'Segoe UI Variable Text','Segoe UI',sans-serif}
.gl{font-family:'Segoe Fluent Icons','Segoe MDL2 Assets';font-style:normal;line-height:1}
.box{position:absolute;border-radius:12px;overflow:hidden}
.box>.bg{position:absolute;inset:0;overflow:hidden}
.wpc{position:absolute;background-repeat:no-repeat;filter:blur(30px) saturate(1.35)}
.box>.bd{position:absolute;inset:0;border-radius:12px;pointer-events:none}
.box>.hd{position:absolute;left:0;right:0;top:0;height:54px}
.ttl{position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;justify-content:center;font:600 22px 'Segoe UI Variable Display','Segoe UI';white-space:nowrap}
.tab{position:absolute;top:9px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font:600 19px 'Segoe UI Variable Display','Segoe UI';white-space:nowrap}
.hb{position:absolute;top:9px;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px}
.body{position:absolute;left:0;right:0;overflow:hidden}
.it{position:absolute;width:146px;height:160px;display:flex;flex-direction:column;align-items:center;border-radius:10px;box-sizing:border-box;padding-top:10px}
.ic{position:relative;width:88px;height:88px;flex:none}
.ic img{position:absolute;inset:0;width:88px;height:88px;object-fit:contain}
.lb{font:400 18.5px 'Segoe UI Variable Text','Segoe UI';text-align:center;line-height:1.2;margin-top:8px;max-width:134px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wl{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8),0 0 6px rgba(0,0,0,.35)}
.card{position:absolute;border-radius:12px;backdrop-filter:blur(40px) saturate(1.3)}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:72px;height:72px;padding:0 22px;border-radius:14px;font:600 28px 'Segoe UI Variable Display','Segoe UI';box-sizing:border-box}
</style></head>
<body><div id="stage"><div class="wp" id="wp"></div><div class="abs" id="shade" style="inset:0"></div><div id="content" class="abs" style="left:0;top:0;transform-origin:0 0"></div></div>
<script>
const P = new URLSearchParams(location.hash.slice(1));
const SCENE = P.get('scene') || 'tabs', THEME = P.get('theme') || 'dark';
const D = THEME === 'dark';
const ACC = D ? '#4CC2FF' : '#0067C0', ACCR = D ? '76,194,255' : '0,103,192';
const FG = D ? '#FFFFFF' : '#1B1B1B';
// A soft vignette over the wallpaper.
const SHADE = D ? 'radial-gradient(ellipse at 50% 45%,rgba(0,0,0,.05),rgba(0,0,0,.32))' : 'radial-gradient(ellipse at 50% 45%,rgba(255,255,255,0),rgba(255,255,255,.18))';

// ---------- time ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
// A CSS cubic-bezier(x1, y1, x2, y2) timing function.
function bez(x1, y1, x2, y2) {
  const f = (a, b, u) => 3 * a * u * (1 - u) * (1 - u) + 3 * b * u * u * (1 - u) + u * u * u;
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let lo = 0, hi = 1, u = x;
    for (let i = 0; i < 24; i++) { u = (lo + hi) / 2; if (f(x1, x2, u) < x) lo = u; else hi = u; }
    return f(y1, y2, u);
  };
}
// Windows' own motion (Fluent): things move from point to point quickly at first and settle
// gently; what appears decelerates into place. The pointer moves as a hand does (`hand`).
const io = bez(.55, .55, 0, 1);
const out = bez(.1, .9, .2, 1);
const hand = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const lerp = (a, b, x) => a + (b - a) * x;
const mix = (a, b, x) => Array.isArray(a) ? a.map((v, i) => lerp(v, b[i], x)) : lerp(a, b, x);
// A value through keyframes [[t, v], ...], eased between them.
function kf(t, keys, e = io) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++)
    if (t <= keys[i][0]) return mix(keys[i - 1][1], keys[i][1], e(seg(t, keys[i - 1][0], keys[i][0])));
  return keys[keys.length - 1][1];
}
// The last of [[t, v], ...] that has begun.
const step = (t, keys) => keys.reduce((v, k) => t >= k[0] ? k[1] : v, keys[0][1]);

// ---------- icons ----------
const NAME = n => n.startsWith('folder_') ? n.slice(7) : n.replace(/\.(docx|xlsx|pptx|md|one|txt|jpg)$/, '');
const SRC = n => 'icons/' + encodeURIComponent(n) + '.png';
const APPS = ['Steam', 'Spotify', 'Discord', 'VS Code', 'Terminal', 'Google Chrome', 'Firefox', 'Calculator'];
const DOCS = ['Report.docx', 'Cover letter.docx', 'Pitch.pptx', 'Manual.docx', 'Meeting.one', 'Contract.docx', 'Plan.md', 'Resume.docx'];
const SHEETS = ['Budget.xlsx', 'Data.xlsx', 'Sales Q1.xlsx', 'Taxes.xlsx', 'Receipt.xlsx', 'Invoice 039.xlsx'];
const PHOTOS = ['Beach.jpg', 'Hiking.jpg', 'Holiday.jpg', 'Lake.jpg', 'Mountains.jpg', 'Sunset.jpg', 'Map.jpg', 'Photo.jpg'];
const GAMES = ['Steam', 'Xbox', 'Discord', 'Microsoft Store'];
const FOLDERS = ['Archive', 'Art', 'Games', 'Invoices', 'Movies', 'Music', 'Photos', 'Podcasts', 'Projects', 'Recipes', 'Scans', 'School', 'Taxes', 'Travel', 'Trips'].map(n => 'folder_' + n);

// ---------- boxes, as Deskboxes draws them ----------
const PX = 14, PY = 8, CW = 146, CH = 160, HEAD = 54;
const bw = c => 2 * PX + c * CW, bh = r => HEAD + 2 * PY + r * CH;
const TINTS = { teal: [22, 128, 140], purple: [112, 86, 214], green: [30, 138, 82], amber: [200, 126, 24], rose: [196, 60, 104], blue: [38, 100, 214], slate: [72, 86, 108] };
const rgb = c => Array.isArray(c) ? c : TINTS[c];
function boxBg(tint, op = 1) {
  if (tint) { const [r, g, b] = rgb(tint).map(Math.round); return D ? `rgba(${r},${g},${b},${.56 * op})` : `linear-gradient(rgba(${r},${g},${b},${.34 * op}),rgba(${r},${g},${b},${.34 * op})),rgba(255,255,255,${.42 * op})`; }
  return D ? `rgba(22,24,34,${.66 * op})` : `rgba(250,251,253,${.62 * op})`;
}
// One icon with its name. o: o (opacity), sel, ring (0..1 accent glow), blend (0..1), tint (color), priv (0..1), s (scale), wl (white label)
function item(n, x, y, o = {}) {
  const sel = o.sel ? `background:rgba(${ACCR},${.26 * o.sel});box-shadow:inset 0 0 0 1.5px rgba(${ACCR},${.8 * o.sel});` : '';
  const ring = o.ring ? `box-shadow:0 0 0 3px rgba(${ACCR},${o.ring}),0 0 ${30 * o.ring}px rgba(${ACCR},${.8 * o.ring});background:rgba(${ACCR},${.22 * o.ring});` : '';
  const op = o.o ?? 1, s = o.s ?? 1;
  const tr = s !== 1 ? `transform:scale(${s});` : '';
  const lc = o.wl || D ? 'wl' : '';
  const pv = o.priv || 0;
  let ic = '';
  if (pv < 1) {
    ic += `<img src="${SRC(n)}" style="${pv || o.blend ? `opacity:${(1 - pv) * (1 - (o.blend || 0))};` : ''}">`;
    // Blending in, as the app does it (iconfx.rs): a copy in shades of the wallpaper's color right
    // behind it, see-through (GHOST_A); its filter is made once that color is known (blendFix).
    if (o.blend) ic += `<img class="ghost" src="${SRC(n)}" style="opacity:${(1 - pv) * o.blend * .78}">`;
    if (o.tint) ic += `<div class="abs" style="inset:0;background:${o.tint};-webkit-mask:url('${SRC(n)}') center/contain no-repeat;mix-blend-mode:color"></div>`;
  }
  if (pv) ic += `<div class="abs" style="inset:8px;border-radius:14px;border:3px dashed ${o.wl || D ? 'rgba(255,255,255,.7)' : 'rgba(0,0,0,.4)'};opacity:${pv}"></div>`;
  const label = pv < 1 ? `<div class="lb ${lc}"${o.blend ? ` data-b="${o.blend}" data-o="${1 - pv}"` : ''} style="${lc ? '' : `color:${FG};`}${pv ? `opacity:${1 - pv};` : ''}">${NAME(n)}</div>` : '';
  const dash = pv ? `<div class="abs" style="left:34px;right:34px;top:116px;height:7px;border-radius:4px;background:${o.wl || D ? 'rgba(255,255,255,.8)' : 'rgba(0,0,0,.45)'};opacity:${pv}"></div>` : '';
  return `<div class="it ui" style="left:${x}px;top:${y}px;${sel}${ring}${op !== 1 ? `opacity:${op};` : ''}${tr}"><div class="ic">${ic}</div>${label}${dash}</div>`;
}
// Icons in rows of `cols`; f(i) gives each one's options.
function grid(names, cols, f = () => ({}), dx = 0, dy = 0) {
  return names.map((n, i) => item(n, PX + (i % cols) * CW + dx, PY + Math.floor(i / cols) * CH + dy, f(i, n))).join('');
}
// The wallpaper under a box at x, y, blurred, as the app fills a box (a copy of the picture's own
// wallpaper and its shade, lined up with it through the camera; CSS backdrop-filter is lost when
// Chrome renders without a GPU). M: margin, so the blur has no faded edge.
let CAM = null;
function wpCopy(x, y) {
  const c = CAM, M = 120, l = -c.tx / c.k - x - M, t = -c.ty / c.k - y - M;
  const pos = `left:${l}px;top:${t}px;width:${c.W / c.k + 2 * M}px;height:${c.H / c.k + 2 * M}px`;
  return `<div class="wpc" style="${pos};background-image:url(wp_${THEME}.jpg);background-size:${c.sz / c.k}px auto;background-position:${c.px / c.k + M}px ${c.py / c.k + M}px"></div>` +
    `<div class="abs" style="${pos};background:${SHADE}"></div>`;
}
// A box. o: x, y, w, h, title | tabs [{n, c, w}], active, tabHover, tint, op (glass), items, cols, f, body (html), roll (0..1),
// left (title on the left), lead (glyph before the title), btns [glyphs on the right], btnColor, z, scale, alpha, ghost, style
function box(o) {
  const L = !D;
  const H = o.h, h = lerp(H, HEAD, o.roll || 0);
  const fg = o.fg || FG;
  const head = o.band || (L ? 'rgba(0,0,0,.04)' : 'rgba(0,0,0,.24)');
  const line = o.line || (L ? 'rgba(0,0,0,.09)' : 'rgba(255,255,255,.13)');
  let hd = '';
  if (o.tabs) {
    let x = 10;
    o.tabs.forEach((t, i) => {
      const act = i === (o.active || 0), hov = i === o.tabHover && !act;
      let bg = 'transparent', c = fg, op = act ? 1 : .66;
      if (t.c) { const [r, g, b] = rgb(t.c); bg = `rgba(${r},${g},${b},${act ? .88 : hov ? .6 : .38})`; c = act ? '#fff' : (D ? '#fff' : '#1B1B1B'); op = act ? 1 : .88; }
      else if (act) bg = L ? 'rgba(0,0,0,.08)' : 'rgba(255,255,255,.14)';
      else if (hov) bg = L ? 'rgba(0,0,0,.05)' : 'rgba(255,255,255,.08)';
      hd += `<div class="tab" style="left:${x}px;width:${t.w}px;background:${bg};color:${c};opacity:${op}">${t.n}</div>`;
      x += t.w + 6;
    });
  } else {
    const pl = o.left ? `justify-content:flex-start;padding-left:${o.lead ? 54 : 20}px;` : '';
    hd += `<div class="ttl" style="color:${fg};${pl}${o.titleStyle || ''}">${o.titleHtml || o.title}</div>`;
    if (o.lead) hd += `<div class="hb gl" style="left:9px;color:${fg};${o.leadStyle || 'opacity:.7'}">${o.lead}</div>`;
  }
  (o.btns || []).slice().reverse().forEach((g, i) => hd += `<div class="hb gl" style="right:${9 + i * 40}px;color:${o.btnColor || fg};${o.btnStyle || ''}">${g}</div>`);
  const body = `<div class="body" style="top:${HEAD + (o.bodyTop || 0)}px;height:${H - HEAD - (o.bodyTop || 0)}px">${o.body ?? grid(o.items || [], o.cols || 4, o.f)}</div>`;
  const sh = o.shadow ?? 1;
  const tr = o.scale && o.scale !== 1 ? `transform:scale(${o.scale});transform-origin:${o.origin || 'center'};` : '';
  return `<div class="box ui" style="left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${h}px;box-shadow:0 26px 64px rgba(0,0,0,${(D ? .4 : .2) * sh}),0 3px 10px rgba(0,0,0,${.14 * sh});${o.z ? 'z-index:' + o.z + ';' : ''}${o.alpha !== undefined ? 'opacity:' + o.alpha + ';' : ''}${tr}${o.style || ''}">
   <div class="bg">${wpCopy(o.x, o.y)}<div class="abs" style="inset:0;background:${boxBg(o.tint, o.op ?? 1)}"></div></div>
   <div class="hd" style="background:${head}"></div>${body}${hd}${o.extra || ''}
   <div class="bd" style="box-shadow:inset 0 0 0 ${o.lineW || 1.5}px ${line}"></div></div>`;
}
// A loose icon on the desktop.
const desk = (n, x, y, o = {}) => `<div class="abs" style="left:0;top:0">${item(n, x, y, Object.assign({ wl: true }, o))}</div>`;
// The pointer, its tip at x, y; `down` (0..1) presses it.
function cursor(x, y, down = 0) {
  const s = 1.5 * (1 - .1 * down);
  return `<svg class="abs" style="left:${x - 1.5 * s}px;top:${y - 1.5 * s}px;width:${22 * s}px;height:${32 * s}px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45));z-index:90;overflow:visible" viewBox="0 0 22 32"><path d="M1.5 1.5v24.2l6.2-6 4.3 9.6 4-1.8-4.2-9.4h8.6z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
}
// Rings spreading out where the pointer clicked: clicks [[t, x, y], ...].
function ripples(t, clicks) {
  return clicks.map(([tc, x, y]) => {
    const a = (t - tc) / .5;
    if (a < 0 || a > 1) return '';
    const r = 10 + 34 * out(a);
    return `<div class="abs" style="left:${x - r}px;top:${y - r}px;width:${2 * r}px;height:${2 * r}px;border-radius:50%;border:3px solid rgba(255,255,255,${.95 * (1 - a)});box-shadow:0 0 14px rgba(${ACCR},${.7 * (1 - a)});z-index:89;box-sizing:border-box"></div>`;
  }).join('');
}
// How far the button is down (0..1) around each click.
const pressed = (t, clicks) => Math.max(0, ...clicks.map(([tc]) => 1 - Math.abs(t - tc - .04) / .1));
// The pointer along keyframes [[t, x, y], ...], with its clicks.
function pointer(t, keys, clicks = []) {
  const [x, y] = kf(t, keys.map(k => [k[0], [k[1], k[2]]]), hand);
  // A ring where it clicks: the clips show what was clicked by it.
  return { x, y, html: ripples(t, clicks.map(c => [c, ...kf(c, keys.map(k => [k[0], [k[1], k[2]]]), hand)])) + cursor(x, y, pressed(t, clicks.map(c => [c]))) };
}
function key(txt, w, down = 0) {
  const k = D ? `background:linear-gradient(#3C3C42,#2B2B30);color:#fff;box-shadow:0 ${6 - 4 * down}px 0 #16161A,0 ${12 - 6 * down}px 26px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14)`
    : `background:linear-gradient(#FFFFFF,#EDEDF1);color:#1B1B1B;box-shadow:0 ${6 - 4 * down}px 0 #B9B9C2,0 ${12 - 6 * down}px 26px rgba(0,0,0,.22),inset 0 1px 0 #fff`;
  return `<div class="key" style="${k};${w ? 'min-width:' + w + 'px;' : ''}transform:translateY(${4 * down}px)">${txt}</div>`;
}
const WINLOGO = `<svg width="28" height="28" viewBox="0 0 28 28"><g fill="${ACC}"><rect x="1" y="1" width="12" height="12" rx="1.5"/><rect x="15" y="1" width="12" height="12" rx="1.5"/><rect x="1" y="15" width="12" height="12" rx="1.5"/><rect x="15" y="15" width="12" height="12" rx="1.5"/></g></svg>`;
const plus = `<span style="font:600 30px 'Segoe UI';margin:0 14px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5)">+</span>`;
function card(x, y, w, h, inner, extra = '') {
  return `<div class="card ui" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${D ? 'rgba(38,40,48,.82)' : 'rgba(252,252,253,.86)'};box-shadow:0 24px 60px rgba(0,0,0,${D ? .45 : .2}),inset 0 0 0 1px ${D ? 'rgba(255,255,255,.10)' : 'rgba(0,0,0,.07)'};color:${FG};${extra}">${inner}</div>`;
}
function toggle(on, x, y) {
  const c = on > .5;
  return `<div class="abs" style="left:${x}px;top:${y}px;width:64px;height:32px;border-radius:16px;box-sizing:border-box;background:${c ? ACC : 'transparent'};border:${c ? 0 : 2}px solid ${D ? 'rgba(255,255,255,.6)' : 'rgba(0,0,0,.55)'}"><div class="abs" style="top:${c ? 7 : 5}px;left:${lerp(5, 38, on) - (c ? 0 : 2)}px;width:18px;height:18px;border-radius:50%;background:${c ? (D ? '#00243A' : '#fff') : (D ? 'rgba(255,255,255,.8)' : 'rgba(0,0,0,.6)')}"></div></div>`;
}
// A soft light behind what the picture is about.
const glow = (x, y, r, a = .35) => `<div class="abs" style="left:${x - r}px;top:${y - r}px;width:${2 * r}px;height:${2 * r}px;border-radius:50%;background:radial-gradient(closest-side,rgba(${ACCR},${a}),rgba(${ACCR},0));pointer-events:none"></div>`;

// ---------- scenes ----------
// Each: w, h (default 1600x900), wp [size, x, y] of the wallpaper, cam [x, y, w, h] (the part shown), dur (seconds; none: a still), draw(t).
const S = {};

S.home = { w: 1920, h: 534, wp: [2000, -40, -620], cam: [0, 0, 1920, 534], draw: () =>
  box({ x: 830, y: 52, w: bw(4), h: bh(2), tabs: [{ n: 'Documents', w: 150 }, { n: 'Spreadsheets', c: 'green', w: 168 }], items: DOCS }) +
  box({ x: 1470, y: 52, w: bw(3) - 20, h: bh(2), title: 'Apps', items: ['Steam', 'Spotify', 'Discord', 'VS Code', 'Terminal', 'Google Chrome'], cols: 3, f: () => ({}) }) +
  box({ x: 830, y: 458, w: bw(4), h: HEAD, title: 'Folders' }) +
  box({ x: 1470, y: 458, w: bw(3) - 20, h: HEAD, title: 'Games', tint: 'teal' }) };

S.boxes = { wp: [1900, -150, -380], cam: [70, 70, 1480, 832], draw: () =>
  box({ x: 90, y: 100, w: bw(4), h: bh(2), tabs: [{ n: 'Documents', w: 150 }, { n: 'Spreadsheets', c: 'green', w: 168 }], items: DOCS }) +
  box({ x: 736, y: 100, w: bw(3), h: bh(2), title: 'Apps', items: APPS.slice(0, 6), cols: 3 }) +
  box({ x: 1236, y: 100, w: bw(2), h: bh(2), title: 'Photos', tint: 'purple', items: PHOTOS.slice(0, 4), cols: 2 }) +
  box({ x: 90, y: 530, w: bw(4), h: bh(1), title: 'Folders', items: FOLDERS.slice(0, 4) }) +
  box({ x: 736, y: 530, w: bw(3), h: HEAD, title: 'Games', tint: 'teal' }) +
  box({ x: 736, y: 602, w: bw(3), h: HEAD, title: 'Archives' }) +
  box({ x: 1236, y: 530, w: bw(2), h: HEAD, title: 'Projects', tint: 'amber' }) };

S.look = { wp: [1900, -260, -420], cam: [150, 100, 1300, 731], draw: () => {
  const b = (o) => box(Object.assign({ w: bw(3), h: bh(1), cols: 3 }, o));
  const p = pointer(0, [[0, 1290, 545]]);
  return b({ x: 190, y: 150, title: 'Documents', titleStyle: "font-family:Georgia,serif;font-weight:700;font-size:24px", line: ACC, lineW: 3, items: DOCS.slice(0, 3) }) +
    b({ x: 850, y: 150, title: 'Apps', left: true, tint: 'teal', fg: '#fff', band: 'rgba(14,110,122,.92)', line: 'rgba(14,110,122,1)', lineW: 3, style: 'border-radius:4px', items: APPS.slice(0, 3) }) +
    b({ x: 190, y: 470, title: 'Photos', titleStyle: "font-family:'Segoe Print';font-weight:400", tint: 'purple', line: 'rgba(255,255,255,.75)', lineW: 2, items: PHOTOS.slice(0, 3) }) +
    b({ x: 850, y: 470, title: 'Projects', titleStyle: 'font-weight:400', btns: ['', '', ''], btnStyle: 'opacity:.8', style: 'border-radius:22px', items: FOLDERS.slice(7, 10) }) + p.html;
} };

S.icons = { wp: [1900, -240, -360], cam: [300, 160, 1000, 562], draw: () => {
  const T = D ? 'rgb(120,200,255)' : 'rgb(0,95,184)';
  const half = (clip, f) => `<div class="abs" style="left:0;top:0;width:1600px;height:900px;clip-path:${clip}">` +
    box({ x: 494, y: 245, w: bw(4), h: bh(2), title: 'Apps', items: APPS, f }) + `</div>`;
  return half('inset(0 800px 0 0)', () => ({})) + half('inset(0 0 0 800px)', () => ({ tint: T })) +
    `<div class="abs" style="left:798px;top:180px;width:4px;height:560px;border-radius:2px;background:#fff;box-shadow:0 0 18px rgba(0,0,0,.45)"></div>` +

S.search = { dur: 6.6, wp: [1900, -280, -360], cam: [0, 0, 1600, 900], draw: t => {

S.pages = { dur: 5.4, wp: [1900, -300, -360], cam: [110, 110, 1380, 776], draw: t => {

  const t1 = .95, t2 = 3.35, S1 = .62;
  const f = t < t2 ? back(seg(t, t1, t1 + S1)) : 1 - back(seg(t, t2, t2 + S1));

  const pageA = o => box(Object.assign({ x: 200 + o, y: 250, w: bw(4), h: bh(2), tabs: [{ n: 'Documents', w: 150 }, { n: 'Sheets', c: 'green', w: 100 }], items: DOCS }, {})) +

  const pageB = o => box({ x: 200 + o, y: 250, w: bw(3), h: bh(2), cols: 3, title: 'Games', tint: 'teal', items: GAMES.concat(['Spotify', 'Blender']) }) +
    box({ x: 720 + o, y: 250, w: bw(4), h: bh(2), title: 'Photos', tint: 'purple', items: PHOTOS });
  let html = glow(800, 470, 620, D ? .14 : .1);

  const nt = t < t2 ? seg(t, t1, t1 + .3) : seg(t, t2, t2 + .3);
  const [from, to, dir] = t < t2 ? [0, 1, 1] : [1, 0, -1];

  let names_ = '';
  if (!started) names_ = label(names[0], 0, 1);

    names_ += label(names[from], -dir * 40 * e, Math.max(0, 1 - e * 2.2));

content.style.width = W + 'px'; content.style.height = H + 'px';
// The camera: the scene's `cam` fills the picture; the wallpaper moves a little with it.

// ---------- blending in (iconfx.rs) ----------
// The wallpaper as shown, to read the color behind an icon from (the app's wall_color_at).
let WALL = null;
function wallAt(x, y) {
  const R = 24, s = [0, 0, 0];
  let n = 0;
  for (let j = -R; j <= R; j += 8) for (let i = -R; i <= R; i += 8) {
    const u = Math.round(clamp(x + i, 0, W - 1)), v = Math.round(clamp(y + j, 0, H - 1)), o = 4 * (v * W + u);
    s[0] += WALL[o]; s[1] += WALL[o + 1]; s[2] += WALL[o + 2]; n++;
  }
  return s.map(c => c / n / 255);
}
const mixc = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t), WHITE = [1, 1, 1];
// Lightness 0, .25, .5, .75, 1 → the wallpaper color, darker and lighter (blend_ramp).
const blendRamp = c => [c.map(v => v * .62), c.map(v => v * .84), mixc(c, WHITE, .10), mixc(c, WHITE, .28), mixc(c, WHITE, .52)];
const fxSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
fxSvg.setAttribute('style', 'position:absolute;width:0;height:0');
document.body.appendChild(fxSvg);
const made = new Set();
function ghostFilter(c) {
  const q = c.map(v => Math.round(v * 255 / 4) * 4);
  const id = 'g' + q.map(v => Math.min(255, v).toString(16).padStart(2, '0')).join('');
  if (!made.has(id)) {
    made.add(id);
    const r = blendRamp(q.map(v => Math.min(255, v) / 255));
    const fn = ch => `<feFunc${'RGB'[ch]} type="table" tableValues="${r.map(x => x[ch].toFixed(4)).join(' ')}"/>`;
    fxSvg.innerHTML += `<filter id="${id}" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".299 .587 .114 0 0 .299 .587 .114 0 0 .299 .587 .114 0 0 0 0 0 1 0"/><feComponentTransfer>${fn(0)}${fn(1)}${fn(2)}</feComponentTransfer></filter>`;
  }
  return id;
}
// The drawn frame's blended icons and names take the color behind them.
function blendFix() {
  for (const g of content.querySelectorAll('img.ghost')) {
    const b = g.getBoundingClientRect();
    g.style.filter = `url(#${ghostFilter(wallAt(b.x + b.width / 2, b.y + b.height / 2))})`;
  }
  for (const l of content.querySelectorAll('.lb[data-b]')) {
    const t = +l.dataset.b, b = l.parentElement.querySelector('.ic').getBoundingClientRect();
    const c = wallAt(b.x + b.width / 2, b.y + b.height / 2);
    const white = l.classList.contains('wl');
    const text = white ? WHITE : [27 / 255, 27 / 255, 27 / 255];
