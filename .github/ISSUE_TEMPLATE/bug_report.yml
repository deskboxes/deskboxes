name: Bug report
description: Something in Deskboxes doesn't work as it should.
labels: ["Issue-Bug", "Needs-Triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search the [existing issues](https://github.com/deskboxes/deskboxes/issues?q=is%3Aissue) first; if one matches, add a 👍 or your details there.

        **Desktop icons gone?** Run `"%LOCALAPPDATA%\Programs\Deskboxes\deskboxes.exe" --restore-icons` to bring Windows' own icons back, then report what happened.

        To report a security vulnerability, don't open an issue: see [SECURITY.md](https://github.com/deskboxes/deskboxes/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Deskboxes version
      description: Settings › About shows it.
      placeholder: "0.1.4"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Press Win+R, type `winver` and copy the version and OS build.
      placeholder: "Windows 11 25H2 (OS Build 26200.7171)"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where does the problem show up?
      options:
        - Boxes and tabs
        - Moving, dragging and dropping icons
        - Sorting rules
        - Desktop pages
        - Boxes above windows
        - Folder boxes
        - Search
        - Right-click menus
        - Settings window
        - Setup and updates
        - Performance or memory
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. Right-click a box › Box settings › …
        2. Drag an icon onto …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: ✔️ Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: ❌ Actual behavior
      description: What happened instead? Screenshots or a short screen recording help a lot (Win+Shift+S, or Win+Shift+R).
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Anything that may matter, e.g. number of monitors and their scaling, number of desktop icons, OneDrive desktop backup, other desktop or shell tools.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Logs are in `%LOCALAPPDATA%\Deskboxes\logs`. Attach `deskboxes.log` (drag the file into this box). They contain file names from your desktop; remove anything you don't want to share.
